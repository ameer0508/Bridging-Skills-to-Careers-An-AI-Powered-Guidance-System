# SkillBridge container stack.
#
#   cp .env.example .env      # then fill in the required secrets
#   docker compose up --build -d
#
# Only the frontend (3000) and backend API (5000) are published to the host.
# MongoDB and the AI service are reachable solely on the internal Docker network.
# Ollama (local models) sits on its own internal-only network shared with the AI service alone:
# no published port and no route to the internet. The approved model is downloaded once with
#   docker compose --profile setup run --rm ollama-pull

services:
  mongodb:
    image: mongo:7
    container_name: skillbridge-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - skillbridge-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: skillbridge-ai
    # Internal only: the backend is the single caller. Not published to the host.
    expose:
      - "8000"
    environment:
      - ENV=production
      - PORT=8000
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - SKILLBRIDGE_ENABLE_GEMINI=${SKILLBRIDGE_ENABLE_GEMINI:-false}
      - SKILLBRIDGE_GEMINI_NO_BILLING_ATTESTED=${SKILLBRIDGE_GEMINI_NO_BILLING_ATTESTED:-false}
      # Local model (Ollama service below): off unless ENABLE_LOCAL_MODEL=true. The endpoint is
      # fixed to the internal service; the adapter refuses any other non-loopback host.
      - ENABLE_LOCAL_MODEL=${ENABLE_LOCAL_MODEL:-false}
      - LOCAL_MODEL_ENDPOINT=http://ollama:11434/api/generate
      - LOCAL_MODEL_NAME=${LOCAL_MODEL_NAME:-qwen3:4b-instruct-2507-q4_K_M}
      - LOCAL_MODEL_TIMEOUT_SECONDS=${LOCAL_MODEL_TIMEOUT_SECONDS:-120}
      - LOCAL_MODEL_NUM_CTX=${LOCAL_MODEL_NUM_CTX:-8192}
      - LOCAL_MODEL_MAX_TOKENS=${LOCAL_MODEL_MAX_TOKENS:-384}
      - LOCAL_MODEL_STRUCTURED_MAX_TOKENS=${LOCAL_MODEL_STRUCTURED_MAX_TOKENS:-768}
      - CORS_ALLOWED_ORIGINS=
      # AI observability (X11): codes and timings only, owner-only files, purged after the retention period
      - AI_AUDIT_DIR=/app/storage/ai-audit
      - AI_AUDIT_RETENTION_DAYS=${AI_AUDIT_RETENTION_DAYS:-14}
    volumes:
      - ai-storage:/app/storage
    networks:
      - skillbridge-network
      - skillbridge-ai-local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skillbridge-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/skillbridge
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-15m}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      # Longer than LOCAL_MODEL_TIMEOUT_SECONDS, shorter than nginx's proxy_read_timeout (150s)
      - CHAT_AI_TIMEOUT_MS=${CHAT_AI_TIMEOUT_MS:-130000}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
      # OnJob.io live listings in the Career Lab comparison (A1): off unless both are true
      - SKILLBRIDGE_ENABLE_ONJOB=${SKILLBRIDGE_ENABLE_ONJOB:-false}
      - SKILLBRIDGE_ONJOB_FEED_TERMS_ACCEPTED=${SKILLBRIDGE_ONJOB_FEED_TERMS_ACCEPTED:-false}
      - UPLOAD_DIR=/app/storage/uploads
      - LOG_DIR=/app/storage/logs
    volumes:
      - backend-storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - skillbridge-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin: nginx in this container proxies /api to the backend
        - VITE_API_URL=/api/v1
    container_name: skillbridge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - skillbridge-network
    restart: unless-stopped

  # Local model server. Internal network only: reachable by the AI service, not by the host,
  # the browser, the backend or MongoDB, and unable to reach the internet (so no cloud models).
  ollama:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    container_name: skillbridge-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_CONTEXT_LENGTH=${LOCAL_MODEL_NUM_CTX:-8192}
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NO_CLOUD=1
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - skillbridge-ai-local
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-off download of the approved model into the shared volume. Not started by `up`;
  # the model name is fixed here so nothing else can be pulled through it.
  ollama-pull:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    profiles: ["setup"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 5 && ollama pull qwen3:4b-instruct-2507-q4_K_M && ollama list"]
    environment:
      - OLLAMA_NO_CLOUD=1
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ollama-download

networks:
  skillbridge-network:
    driver: bridge
  skillbridge-ai-local:
    driver: bridge
    internal: true
  ollama-download:
    driver: bridge

volumes:
  mongo-data:
  backend-storage:
  ai-storage:
  ollama-models:
