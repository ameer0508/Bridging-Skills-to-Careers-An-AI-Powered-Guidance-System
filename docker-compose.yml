version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: skillbridge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - skillbridge-network
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: skillbridge-ai
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENV=production
      - PORT=8000
    networks:
      - skillbridge-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skillbridge-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/skillbridge
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1d
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      - mongodb
      - ai-service
    networks:
      - skillbridge-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: skillbridge-frontend
    ports:
      - "3000:80"
    networks:
      - skillbridge-network
    restart: unless-stopped

networks:
  skillbridge-network:
    driver: bridge

volumes:
  mongo-data:
