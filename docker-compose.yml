# SkillBridge container stack.
#
#   cp .env.example .env      # then fill in the required secrets
#   docker compose up --build -d
#
# Only the frontend (3000) and backend API (5000) are published to the host.
# MongoDB and the AI service are reachable solely on the internal Docker network.

services:
  mongodb:
    image: mongo:7
    container_name: skillbridge-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - skillbridge-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: skillbridge-ai
    # Internal only: the backend is the single caller. Not published to the host.
    expose:
      - "8000"
    environment:
      - ENV=production
      - PORT=8000
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - CORS_ALLOWED_ORIGINS=
    networks:
      - skillbridge-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skillbridge-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/skillbridge
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-15m}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
      - UPLOAD_DIR=/app/storage/uploads
      - LOG_DIR=/app/storage/logs
    volumes:
      - backend-storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - skillbridge-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin: nginx in this container proxies /api to the backend
        - VITE_API_URL=/api/v1
    container_name: skillbridge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - skillbridge-network
    restart: unless-stopped

networks:
  skillbridge-network:
    driver: bridge

volumes:
  mongo-data:
  backend-storage:
