server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resume uploads are limited to 5 MB by the backend; allow a little headroom
    client_max_body_size 6m;

    # API requests are proxied to the backend so the browser stays same-origin
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI-backed endpoints (chat) can take longer than nginx's 60s default allows for retries
        proxy_read_timeout 90s;
    }

    # Hashed build assets can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /home after a refresh) serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
