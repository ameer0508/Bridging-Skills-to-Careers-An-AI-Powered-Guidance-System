name: Docker Compose smoke test

# Builds the four images, starts the stack and checks that the services work together.
#
# Run it by hand: Actions > "Docker Compose smoke test" > Run workflow (pick the branch),
# or `gh workflow run docker-smoke.yml --ref <branch>`.
# It also runs when this file itself changes, so that the workflow is registered and any edit to
# it is tried once. It does not run on ordinary pushes.
#
# Everything it uses is synthetic: random secrets generated for the run, a test user, a generated
# resume. No provider keys are set, so Gemini and JSearch are never contacted.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/docker-smoke.yml'

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create synthetic settings
        run: |
          {
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "INTERNAL_SERVICE_KEY=$(openssl rand -hex 32)"
            echo "FRONTEND_URL=http://localhost:3000"
            echo "GEMINI_API_KEY="
            echo "RAPIDAPI_KEY="
          } > .env
          # Where the smoke test keeps its synthetic account between the two runs
          echo "SMOKE_STATE=$RUNNER_TEMP/skillbridge-docker-smoke.json" >> "$GITHUB_ENV"

      - name: 1. Validate the Compose file
        run: docker compose config --quiet

      - name: Compose refuses to start without the required secrets
        run: |
          if docker compose --env-file /dev/null config --quiet 2>/dev/null; then
            echo "::error::Compose accepted a configuration with no secrets"
            exit 1
          fi
          echo "refused, as intended"

      - name: 2. Build the images
        run: docker compose build

      - name: 3. Start MongoDB, AI service, backend and frontend
        run: docker compose up -d --wait --wait-timeout 300

      - name: 4. Container state
        run: |
          docker compose ps
          for service in mongodb ai-service backend frontend; do
            state=$(docker compose ps --format '{{.State}}' "$service")
            echo "$service: $state"
            [ "$state" = "running" ] || { echo "::error::$service is $state"; exit 1; }
          done
          for service in mongodb ai-service; do
            health=$(docker compose ps --format '{{.Health}}' "$service")
            [ "$health" = "healthy" ] || { echo "::error::$service health is $health"; exit 1; }
          done

      - name: Services run as unprivileged users
        run: |
          [ "$(docker compose exec -T backend id -u)" != "0" ] || { echo "::error::backend runs as root"; exit 1; }
          [ "$(docker compose exec -T ai-service id -u)" != "0" ] || { echo "::error::ai-service runs as root"; exit 1; }

      - name: 6. Backend reaches the AI service; the AI service is not published
        run: |
          docker compose exec -T backend node -e "fetch('http://ai-service:8000/api/v1/health').then(r=>{if(r.status!==200)process.exit(1);return r.text()}).then(t=>console.log(t.slice(0,200))).catch(e=>{console.error(e.message);process.exit(1)})"
          # A request without the internal key is refused by the AI service
          docker compose exec -T backend node -e "fetch('http://ai-service:8000/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:'hi'})}).then(r=>{console.log('without key:',r.status);process.exit(r.status===401?0:1)})"
          if curl -s -m 5 -o /dev/null http://localhost:8000/api/v1/health; then
            echo "::error::the AI service is reachable from the host"
            exit 1
          fi
          if curl -s -m 5 -o /dev/null http://localhost:27017; then
            echo "::error::MongoDB is reachable from the host"
            exit 1
          fi
          echo "AI service and MongoDB are reachable only inside the Compose network"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 5, 7, 8. Connectivity, authentication and the resume-to-career workflow
        run: node e2e/docker-smoke.mjs

      - name: Local OCR works in the AI container with every approved language (X1)
        run: |
          docker compose images ai-service
          docker compose exec -T ai-service tesseract --version | head -1
          docker compose exec -T ai-service tesseract --list-langs
          for lang in eng hin tel tam kan mal; do
            docker compose exec -T ai-service tesseract --list-langs | tr -d '\r' | grep -qx "$lang" || { echo "::error::OCR language $lang missing"; exit 1; }
          done
          # A scanned English and a scanned Hindi page are read through the real pipeline
          docker compose exec -T ai-service python -m app.multilingual.ocr_selfcheck

      - name: AI audit log is written to private files and holds no request content (X11)
        run: |
          # One gateway request with a recognisable prompt; no provider keys are set, so nothing leaves the stack
          docker compose exec -T backend node -e "fetch('http://ai-service:8000/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Internal-Service-Key':process.env.INTERNAL_SERVICE_KEY},body:JSON.stringify({prompt:'AUDIT-CANARY Priya Sharma priya@example.com'})}).then(r=>console.log('chat:',r.status))"
          summary() { docker compose exec -T ai-service python -c "import json,os,urllib.request as u; r=u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/observability/summary?window_hours=24',headers={'X-Internal-Service-Key':os.environ['INTERNAL_SERVICE_KEY']})); d=json.load(r)['data']; print(d['events'], d['scope']['source'])"; }
          read events source <<< "$(summary)"
          echo "audit events: $events ($source)"
          test "$source" = "files" && test "$events" -gt 0
          echo "$events" > audit-before.txt
          # Owner-only directory and files, and no prompt text or e-mail address in them
          docker compose exec -T ai-service sh -c 'stat -c "%a" /app/storage/ai-audit' | tr -d '[:space:]' | grep -qx 700
          docker compose exec -T ai-service sh -c 'ls /app/storage/ai-audit/*.jsonl | wc -l' | tr -d '[:space:]' | grep -vqx 0
          docker compose exec -T ai-service sh -c 'find /app/storage/ai-audit -type f -perm /077 | wc -l' | tr -d '[:space:]' | grep -qx 0
          ! docker compose exec -T ai-service sh -c 'cat /app/storage/ai-audit/*.jsonl' | grep -Eqi 'canary|priya|example\.com'

      - name: Data survives a restart of every container
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 300
          node e2e/docker-smoke.mjs --verify
          # The restarted AI service still reports the audit events recorded before
          after=$(docker compose exec -T ai-service python -c "import json,os,urllib.request as u; r=u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/observability/summary?window_hours=24',headers={'X-Internal-Service-Key':os.environ['INTERNAL_SERVICE_KEY']})); print(json.load(r)['data']['events'])" | tr -d '[:space:]')
          echo "audit events after restart: $after (before: $(cat audit-before.txt))"
          test "$after" -ge "$(cat audit-before.txt)"

      - name: Interview recordings live on the private storage volume and the retention job removes expired ones
        run: |
          count() { docker compose exec -T backend sh -c 'find /app/storage/voice-recordings -type f 2>/dev/null | wc -l' | tr -d '[:space:]'; }
          echo "recording files on the volume: $(count)"
          test "$(count)" = "1"
          # Only the service account may read them
          docker compose exec -T backend sh -c 'find /app/storage/voice-recordings -type f -perm /077 | wc -l' | tr -d '[:space:]' | grep -qx 0
          # Expire what is left, then run the retention job the way cron would
          docker compose exec -T mongodb mongosh skillbridge --quiet --eval 'print(db.voicerecordings.updateMany({}, { $set: { expiresAt: new Date(0) } }).modifiedCount)' | tr -d '[:space:]' | grep -qx 1
          docker compose exec -T backend node backend/dist/scripts/purgeVoiceRecordings.js | tee purge.json
          grep -q '"removed":1' purge.json
          grep -q '"pending":0' purge.json
          test "$(count)" = "0"
          node e2e/docker-smoke.mjs --after-expiry
          # Running it again finds nothing to do
          docker compose exec -T backend node backend/dist/scripts/purgeVoiceRecordings.js | grep -q '"removed":0'

      - name: 9. Check the logs for startup failures
        if: always()
        run: |
          # Give the backend's own retention job (five seconds after start) time to report
          for i in $(seq 1 30); do docker compose logs --no-color backend 2>/dev/null | grep -q "Voice retention:" && break; sleep 2; done
          docker compose logs --no-color > compose.log 2>&1 || true
          echo "log lines: $(wc -l < compose.log)"
          docker compose logs --no-color --tail 25 backend ai-service || true
          if grep -nE "Traceback \(most recent call last\)|UnhandledPromiseRejection|Unhandled Rejection|Failed to establish MongoDB|EADDRINUSE|ECONNREFUSED|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND|nginx: \[emerg\]|Segmentation fault|OOMKilled|Out of memory" compose.log; then
            echo "::error::startup or runtime failures found in the container logs"
            exit 1
          fi
          echo "no startup failures in the logs"
          # The backend runs the retention job itself, five seconds after each start and then daily
          if ! grep -q "Voice retention:" compose.log; then
            echo "::error::the scheduled voice-retention job did not run in the backend container"
            exit 1
          fi
          echo "scheduled voice-retention job ran"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 10. Tear down containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
